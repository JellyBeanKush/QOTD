name: QOTD Bot

on:
  schedule:
    - cron: '0 14 * * *' # 7:00 AM PT
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push history back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/genai node-fetch

      - name: Run QOTD Script
        run: node index.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit and Push History
        run: |
          git config --global user.name "QOTD Bot"
          git config --global user.email "bot@github.com"
          git add qotd_history.json current_qotd.txt
          git commit -m "Update QOTD history [skip ci]" || echo "No changes"
          git push
